services:
  backend:
    build:
      context: ./backend
    container_name: car-price-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: car-price-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
